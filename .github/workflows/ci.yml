name: tests

# Every test in this suite runs with no model and no network -- verified
# by running the full suite against a dead endpoint. That's what makes a
# cross-platform matrix possible here at all: CI never needs Ollama, so
# these jobs test the framework itself, not a model.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported Python range. Linux on every push; all
        # three platforms only when run by hand (Actions -> tests -> Run
        # workflow). While the repository is private, runner minutes are
        # billed and macOS counts 10x: the full matrix cost ~130 billed
        # minutes a run, 100 of them macOS, against a 2,000-minute month.
        # Standard runners are free for a public repository -- once public,
        # put macOS and Windows back on push: they caught real
        # platform-only defects (a Linux-only run-lock miss, a Windows TUI
        # race) that Linux alone would not have.
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch'
              && '["ubuntu-latest", "macos-latest", "windows-latest"]'
              || '["ubuntu-latest"]') }}
        python: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install (with the TUI extra so the Textual tests actually run)
        # The `inspect` extra is deliberately not installed -- it pulls a
        # large dependency tree (numpy/boto3/etc) and nothing under tests/
        # exercises integrations/ directly. Its own import surface is
        # covered by the module-level import check below instead.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,tui]"

      - name: Run the test suite
        run: pytest -q

      - name: Safety invariant, called out separately
        # This is the one suite whose failure means "do not trust any
        # result from this tool" -- worth its own line in the CI log
        # rather than being one dot in the aggregate run above.
        run: pytest tests/test_safety_invariant.py -v

      - name: Every module imports cleanly
        # Catches a platform-specific import error in a module no test
        # happens to touch (integrations/ in particular, which isn't
        # installed with its extra here and must still fail gracefully).
        run: |
          python -c "import openllm_cbench.cli"
          python -c "import openllm_cbench.core.hardware, openllm_cbench.core.canary, openllm_cbench.core.discover, openllm_cbench.core.pull, openllm_cbench.core.community"
          python -c "import openllm_cbench.suites.containment, openllm_cbench.suites.channel, openllm_cbench.suites.persistence"
          python -c "import openllm_cbench.scoring.aggregate, openllm_cbench.scoring.containment_metrics, openllm_cbench.scoring.scorecard"
          # The reconcilers import Inspect lazily. A module-level import here
          # once broke test collection on every platform for two weeks.
          python -c "import openllm_cbench.integrations.inspect_reconcile, openllm_cbench.integrations.inspect_reconcile_persistence"

      - name: cbench doctor runs without an endpoint present
        # doctor must degrade cleanly when nothing is listening -- on CI
        # there is no Ollama, which is exactly the "endpoint unreachable"
        # path a new user hits before starting one.
        run: cbench doctor
