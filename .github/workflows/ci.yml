name: tests

# Every test in this suite runs with no model and no network -- verified
# by running the full suite against a dead endpoint. That's what makes a
# cross-platform matrix possible here at all: CI never needs Ollama, so
# these jobs test the framework itself, not a model.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported Python range, on all three platforms.
        # The project has been developed and run live on Windows; Linux and
        # macOS are covered here because a static read of the code is not
        # the same thing as knowing it runs.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install (with the TUI extra so the Textual tests actually run)
        # The `inspect` extra is deliberately not installed -- it pulls a
        # large dependency tree (numpy/boto3/etc) and nothing under tests/
        # exercises integrations/ directly. Its own import surface is
        # covered by the module-level import check below instead.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,tui]"

      - name: Run the test suite
        run: pytest -q

      - name: Safety invariant, called out separately
        # This is the one suite whose failure means "do not trust any
        # result from this tool" -- worth its own line in the CI log
        # rather than being one dot in the aggregate run above.
        run: pytest tests/test_safety_invariant.py -v

      - name: Every module imports cleanly
        # Catches a platform-specific import error in a module no test
        # happens to touch (integrations/ in particular, which isn't
        # installed with its extra here and must still fail gracefully).
        run: |
          python -c "import openllm_cbench.cli"
          python -c "import openllm_cbench.core.hardware, openllm_cbench.core.canary, openllm_cbench.core.discover, openllm_cbench.core.pull"
          python -c "import openllm_cbench.suites.containment, openllm_cbench.suites.channel, openllm_cbench.suites.persistence"
          python -c "import openllm_cbench.scoring.aggregate, openllm_cbench.scoring.containment_metrics"

      - name: cbench doctor runs without an endpoint present
        # doctor must degrade cleanly when nothing is listening -- on CI
        # there is no Ollama, which is exactly the "endpoint unreachable"
        # path a new user hits before starting one.
        run: cbench doctor
