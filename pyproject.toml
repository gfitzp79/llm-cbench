[build-system]
# >=77 for the SPDX `license` string below; the table form it replaces is
# deprecated and stops building in 2027.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openllm-cbench"
version = "0.1.2"
description = "Local containment and reasoning-leakage testing framework for open-weight LLMs."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Gavin Fitzpatrick" }]
keywords = ["llm", "ai-safety", "security-testing", "red-teaming", "ollama",
            "containment", "reasoning", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # FLOOR IS A SECURITY FLOOR -- do not lower it.
    #
    # >=2.31 permitted three advisories, and the middle one matters for
    # THIS framework in particular:
    #   PYSEC-2026-1872 (<2.32.4) .netrc credentials leaked to a third
    #     party on a maliciously-crafted URL. The containment suite
    #     handles model-supplied URLs by design. Egress is intercepted
    #     before a socket opens, so the suite never fetches one -- but a
    #     dependency floor is not the place to rely on that.
    #   PYSEC-2026-1873 (<2.32.0) Session(verify=False) persisting TLS
    #     verification off for later requests to the same origin.
    #   PYSEC-2026-2275 (<2.33.0) predictable temp filename in
    #     extract_zipped_paths().
    "requests>=2.33.0",
]

[project.urls]
Homepage = "https://github.com/gfitzp79/llm-cbench"
Repository = "https://github.com/gfitzp79/llm-cbench"
Issues = "https://github.com/gfitzp79/llm-cbench/issues"
Security = "https://github.com/gfitzp79/llm-cbench/security"

[project.optional-dependencies]
# Cross-framework reconciliation (integrations/) -- not required for the
# three core suites. See ARCHITECTURE.md for what this buys you.
inspect = [
    "inspect-ai>=0.3.259",
    "openai>=3.1.0,<4.0",
]
tui = [
    # >=6.0 is the lowest release the test suite passes on (measured:
    # 5.3 lacks Static.content, which the TUI tests read). A floor the
    # suite has never run against is a claim, not a floor.
    "textual>=6.0",
]
dev = [
    # >=7.0 permitted PYSEC-2026-1845: pytest through 9.0.2 on UNIX uses
    # a predictable /tmp/pytest-of-{user} directory, which a local user
    # can pre-create to deny service. Dev-only, so it never reaches an
    # installed copy of this package, but it is still a floor that
    # allowed a known-vulnerable version.
    "pytest>=9.0.3",
    "textual>=6.0",
]

[project.scripts]
cbench = "openllm_cbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openllm_cbench = ["data/**/*.json"]
